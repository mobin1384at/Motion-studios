<!DOCTYPE html>
<!-- Example: particles-8s — 8-second vertical (1080x1920) animation in the "particles" style.
     Main text: سپاریک. Single self-contained HTML file.
     Contract: seek(t) renders frame t (seconds, 0..8) as a pure function of t —
     deterministic (seeded PRNG, no Math.random() at render time), so it can be
     captured frame-by-frame with capture.mjs + ffmpeg. See README.md for render commands. -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Particles — سپاریک (8s, 1080x1920)</title>
<style>
  @font-face { font-family: 'Lalezar'; src: url('../../assets/fonts/Lalezar-Regular.ttf') format('truetype'); }
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; background: #0A0E1A; overflow: hidden; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script>
  // ---- Seeded PRNG (mulberry32) — deterministic, no Math.random() ----
  function mulberry32(a){ return function(){ a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  var rand = mulberry32(20261111);

  var W = 1080, H = 1920, DUR = 8;
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');

  // ---- Sample target points from the text shape (offscreen canvas) ----
  var targets = null;
  function buildTargets(){
    var off = document.createElement('canvas'); off.width = W; off.height = H;
    var o = off.getContext('2d');
    o.fillStyle = '#fff'; o.font = '220px Lalezar, Vazirmatn, sans-serif';
    o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillText('سپاریک', W/2, H/2 - 40);
    var data = o.getImageData(0, 0, W, H).data;
    var pts = [];
    for (var y = 0; y < H; y += 7){
      for (var x = 0; x < W; x += 7){
        if (data[(y*W + x)*4 + 3] > 128) pts.push([x, y]);
      }
    }
    // Pick ~2600 points, evenly spread via seeded shuffle
    for (var i = pts.length - 1; i > 0; i--){ var j = Math.floor(rand()*(i+1));
      var tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp; }
    return pts.slice(0, 2600);
  }

  // ---- Particles: each has a start point (seeded), a target, a colour and a phase ----
  var COLORS = ['#22D3EE', '#F472B6', '#FBBF24', '#FFFFFF'];
  var particles = null;
  function buildParticles(){
    targets = buildTargets();
    particles = targets.map(function(p, i){
      var a = rand()*Math.PI*2, r = 500 + rand()*500;
      return {
        tx: p[0], ty: p[1],
        sx: W/2 + Math.cos(a)*r, sy: H/2 + Math.sin(a)*r*1.4,
        c: COLORS[i % COLORS.length],
        size: 1.6 + rand()*2.6,
        ph: rand()*Math.PI*2,
        tw: 0.6 + rand()*0.8
      };
    });
  }

  function easeInOut(k){ return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2; }

  // ---- seek(t): render frame t (0..8). Timeline: 0-2s converge, 2-6s hold+shimmer, 6-8s disperse. ----
  function seek(t){
    if (!particles) buildParticles();
    t = Math.max(0, Math.min(DUR, t));
    ctx.fillStyle = '#0A0E1A'; ctx.fillRect(0, 0, W, H);
    var k; // 0 = scattered, 1 = formed
    if (t < 2) k = easeInOut(t/2);
    else if (t < 6) k = 1;
    else k = 1 - easeInOut((t-6)/2);
    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      var shimmer = Math.sin(t*2.2 + p.ph) * 3 * p.tw;   // gentle shimmer while formed
      var x = p.sx + (p.tx - p.sx)*k + shimmer*k;
      var y = p.sy + (p.ty - p.sy)*k + Math.cos(t*1.8 + p.ph)*2*k;
      var alpha = 0.35 + 0.65*k;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Small caption line at the bottom (fades in with the form)
    ctx.globalAlpha = k;
    ctx.fillStyle = '#F8FAFC'; ctx.font = '600 54px Vazirmatn, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('کتاب خوب، دوباره خوانده می‌شود', W/2, H - 260);
    ctx.globalAlpha = 1;
  }
  window.seek = seek;
  // First paint (fonts may still be loading; capture.mjs should wait for document.fonts.ready then re-seek)
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ particles = null; seek(0); });
  seek(0);
</script>
</body>
</html>
