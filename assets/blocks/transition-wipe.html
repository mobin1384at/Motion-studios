<!-- HyperFrames block: transition-wipe — a diagonal colour wipe that covers the frame.
     Usage: element with data-start (s) and data-duration (s); call seek(t) with the
     global timeline time in seconds; the block renders frame t as a pure function of t. -->
<div class="hf-block hf-wipe" data-start="0" data-duration="0.8">
  <style>
    .hf-wipe{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .hf-wipe .panel{position:absolute;top:-20%;left:-20%;width:140%;height:140%;
      background:#D4621A;transform-origin:center;
      clip-path:polygon(0 0,0 0,0 100%,0 100%)}
    .hf-wipe .panel.second{background:#2A1A0E}
  </style>
  <div class="panel second"></div>
  <div class="panel"></div>
  <script>
    // seek(t): two diagonal panels sweep left -> right; second panel trails 0.12s behind.
    window.hfWipeSeek = function(t){
      var block = document.querySelector('.hf-wipe');
      var start = parseFloat(block.dataset.start), dur = parseFloat(block.dataset.duration);
      var lt = Math.max(0, Math.min(dur, t - start));
      var k = lt / dur;                                        // 0..1
      var e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;      // easeInOutQuad
      var panels = block.querySelectorAll('.panel');
      function wipe(p, kk){
        var x = kk * 140;                                      // sweep 0..140% of width
        p.style.clipPath = 'polygon(0 0,' + x + '% 0,' + Math.max(0, x-25) + '% 100%,0 100%)';
        p.style.opacity = (kk <= 0 || kk >= 1) ? '0' : '1';
      }
      wipe(panels[1], e);
      wipe(panels[0], Math.max(0, Math.min(1, (lt - 0.12) / (dur - 0.12))));
    };
    function seek(t){ window.hfWipeSeek(t); }
  </script>
</div>
