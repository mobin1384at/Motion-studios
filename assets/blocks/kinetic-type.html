<!-- HyperFrames block: kinetic-type — big words swap on the beat.
     Usage: element with data-start (s) and data-duration (s); call seek(t) with the
     global timeline time in seconds; the block renders frame t as a pure function of t. -->
<div class="hf-block hf-kinetic-type" data-start="0" data-duration="4" dir="rtl" lang="fa">
  <style>
    .hf-kinetic-type{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      background:#FAFAF9;overflow:hidden;font-family:'Vazirmatn',sans-serif}
    .hf-kinetic-type .word{position:absolute;font-size:120px;font-weight:900;color:#111;
      opacity:0;white-space:nowrap}
    .hf-kinetic-type .word.accent{color:#EA580C}
  </style>
  <span class="word" data-word="0">سپاریک</span>
  <span class="word accent" data-word="1">کتاب خوب</span>
  <span class="word" data-word="2">دوباره خوانده می‌شود</span>
  <script>
    // seek(t): t = global seconds. Words swap every 1s; each word slides in with overshoot, holds, exits.
    window.hfKineticTypeSeek = function(t){
      var block = document.querySelector('.hf-kinetic-type');
      var start = parseFloat(block.dataset.start), dur = parseFloat(block.dataset.duration);
      var lt = Math.max(0, Math.min(dur, t - start));           // local time, clamped
      var idx = Math.min(2, Math.floor(lt / 1));                // which word is on screen
      var pt = lt - idx;                                        // progress inside the word's 1s slot
      block.querySelectorAll('.word').forEach(function(w, i){
        var op = 0, x = 60, s = 0.9;
        if (i === idx){
          if (pt < 0.25){ var k = pt / 0.25; var e = 1 + 2.7*Math.pow(k-1,3) + 1.7*Math.pow(k-1,2); // easeOutBack
            op = k; x = 60*(1-e); s = 0.9 + 0.1*e; }
          else if (pt < 0.8){ op = 1; x = 0; s = 1; }
          else { var k2 = (pt-0.8)/0.2; op = 1-k2; x = -40*k2; s = 1 - 0.08*k2; }
        }
        w.style.opacity = op.toFixed(3);
        w.style.transform = 'translateX(' + x.toFixed(1) + 'px) scale(' + s.toFixed(3) + ')';
      });
    };
    function seek(t){ window.hfKineticTypeSeek(t); }
  </script>
</div>
